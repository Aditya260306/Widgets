<!DOCTYPE html>

<html class="dark" lang="en"><head>

<title>AURA Widget Builder - Preview</title>

                        "surface-container": "#1f1f25",
                        "surface-bright": "#39383e",
                        "surface-container-high": "#2a292f",
                        "on-tertiary-container": "#003024",
                        "tertiary-container": "#00a481",
                        "on-secondary-fixed": "#241a00",
                        "on-error": "#690005",
                        "inverse-surface": "#e4e1e9",
                        "on-primary-fixed": "#1c0062",
                        "secondary-container": "#ba9000",
                        "on-surface": "#e4e1e9",
                        "inverse-primary": "#613de0",
                        "on-error-container": "#ffdad6",

                        "surface-dim": "#131318",
                        "primary": "#cabeff",
                        "tertiary": "#28dfb3",
                        "on-primary-container": "#2b0088",
                        "outline-variant": "#484555",
                        "outline": "#938ea1",
                        "secondary-fixed-dim": "#efc13e",
                        "primary-fixed": "#e6deff",
                        "error": "#ffb4ab"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {
                        "margin-mobile": "24px",

                    "fontFamily": {
                        "body-lg": ["Noto Serif"],

                    "fontSize": {

<style>
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background h-screen flex flex-col md:flex-row overflow-hidden font-body-md text-body-md">
<!-- Desktop Navigation Shell (TopAppBar replacement for intent mapping) -->
<nav class="hidden md:flex fixed left-0 top-0 h-full w-20 bg-surface-container-lowest flex-col items-center py-6 gap-8 z-50">
<span class="font-headline-md text-headline-md tracking-widest text-primary">A</span>
<div class="flex flex-col gap-6 w-full items-center">
<button class="text-on-surface-variant hover:text-on-surface transition-colors duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add_circle</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-3 scale-90 active:scale-100 transition-all duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">widgets</span>
</button>
<button class="text-on-surface-variant hover:text-on-surface transition-colors duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">auto_awesome_motion</span>
</button>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col md:flex-row w-full h-full md:pl-20">
<!-- Preview Zone (Top 55% Mobile, Left 60% Desktop) -->
<section class="h-[55%] md:h-full md:w-[60%] bg-[#111118] relative flex flex-col noise-bg">
<!-- Header Controls -->
<header class="flex justify-between items-center p-margin-mobile md:p-margin-desktop z-10 absolute top-0 w-full">
<!-- Theme Toggle -->
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">light_mode</span>
</button>
<!-- Size Pills -->
<div class="flex bg-surface-container-low rounded-full p-1 border border-surface-container-highest">
<button class="w-10 h-8 rounded-full text-label-sm font-label-sm flex items-center justify-center text-on-surface-variant hover:text-on-surface">S</button>
<button class="w-10 h-8 rounded-full text-label-sm font-label-sm flex items-center justify-center bg-primary-container text-on-primary-container">M</button>
<button class="w-10 h-8 rounded-full text-label-sm font-label-sm flex items-center justify-center text-on-surface-variant hover:text-on-surface">L</button>
</div>
</header>
<!-- Widget Canvas -->
<div class="flex-1 flex flex-col items-center justify-center relative w-full h-full overflow-hidden">
<!-- Glowing Orb Background Effect -->
<div class="absolute w-[300px] h-[300px] bg-primary/10 rounded-full blur-[80px] top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
<!-- The Widget Mockup -->
<div class="w-[320px] h-[160px] bg-surface rounded-[24px] p-5 flex flex-col justify-between relative z-10 border border-surface-bright/20 group hover:border-primary/30 transition-colors shadow-none" style="box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05);">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="font-data-mono text-data-mono text-on-surface-variant uppercase tracking-wider">New York</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">72°</span>
</div>
<span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: 'FILL' 1;">partly_cloudy_day</span>
</div>
<div class="flex justify-between items-end w-full">
<div class="flex gap-4">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">H: 78°</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">L: 64°</span>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center border border-surface-bright/20">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">air</span>
</div>
</div>
</div>
<!-- Footer Indication -->
<div class="absolute bottom-margin-mobile md:bottom-margin-desktop flex flex-col items-center gap-4">
<!-- Pagination -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Caption -->
<div class="flex items-center gap-2 text-tertiary opacity-70">
<span class="font-label-md text-label-md">Swipe right to approve</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</div>
</div>
</div>
</section>
<!-- Customization Panel (Bottom 45% Mobile, Right 40% Desktop) -->
<section class="h-[45%] md:h-full md:w-[40%] bg-surface-container z-20 flex flex-col rounded-t-[24px] md:rounded-none md:border-l md:border-surface-container-highest overflow-hidden">
<!-- Mobile Handle -->
<div class="w-full flex justify-center pt-4 pb-2 md:hidden">
<div class="w-10 h-1 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-gutter py-4 md:p-gutter hide-scrollbar">
<div class="flex flex-col gap-8 max-w-md mx-auto w-full"><div class="flex flex-col gap-gutter max-w-md mx-auto w-full">
<!-- Content Tone Segmented Control -->
<div class="flex flex-col gap-3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Content Tone</label>
<div class="flex bg-surface-container-low rounded-lg p-1 border border-surface-container-highest">
<button class="flex-1 py-2 text-label-md font-label-md rounded-md text-on-surface-variant hover:text-on-surface transition-colors">Minimal</button>
<button class="flex-1 py-2 text-label-md font-label-md rounded-md bg-surface-container-highest text-on-surface border border-surface-bright/20">Balanced</button>
<button class="flex-1 py-2 text-label-md font-label-md rounded-md text-on-surface-variant hover:text-on-surface transition-colors">Rich</button>
</div>
</div>
<!-- Text Size Segmented Control -->
<div class="flex flex-col gap-3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Text Size</label>
<div class="flex bg-surface-container-low rounded-lg p-1 border border-surface-container-highest">
<button class="flex-1 py-2 text-label-md font-label-md rounded-md text-on-surface-variant hover:text-on-surface transition-colors">Small</button>
<button class="flex-1 py-2 text-label-md font-label-md rounded-md bg-surface-container-highest text-on-surface border border-surface-bright/20">Default</button>
<button class="flex-1 py-2 text-label-md font-label-md rounded-md text-on-surface-variant hover:text-on-surface transition-colors">Large</button>
</div>
</div>
<!-- Accent Colour Swatches -->
<div class="flex flex-col gap-3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest flex justify-between">
                            Accent Colour
                            <span class="text-primary opacity-80">Default</span>
</label>
<div class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar">
<!-- Active Swatch -->
<button class="w-8 h-8 shrink-0 rounded-full bg-primary-container relative flex items-center justify-center ring-2 ring-primary ring-offset-2 ring-offset-surface-container">
<div class="w-2 h-2 rounded-full bg-on-primary-container"></div>
</button>
<button class="w-8 h-8 shrink-0 rounded-full bg-secondary"></button>
<button class="w-8 h-8 shrink-0 rounded-full bg-tertiary"></button>
<button class="w-8 h-8 shrink-0 rounded-full bg-error"></button>
<button class="w-8 h-8 shrink-0 rounded-full bg-surface-bright border border-outline-variant"></button>
<button class="w-8 h-8 shrink-0 rounded-full bg-on-surface"></button>
<button class="w-8 h-8 shrink-0 rounded-full bg-tertiary-container"></button>
<button class="w-8 h-8 shrink-0 rounded-full bg-secondary-container"></button>
</div>
</div>
<!-- Widget Style Tiles -->
<div class="flex flex-col gap-3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Widget Style</label>
<div class="grid grid-cols-3 gap-3">
<button class="h-20 rounded-lg bg-surface flex flex-col items-center justify-center gap-2 border border-surface-bright/20 hover:border-primary/50 transition-colors">
<div class="w-8 h-4 rounded-sm bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Flat</span>
</button>
<button class="h-20 rounded-lg bg-surface flex flex-col items-center justify-center gap-2 border border-primary ring-1 ring-primary/20 bg-primary/5">
<div class="w-8 h-4 rounded-sm border border-primary/50"></div>
<span class="font-label-sm text-label-sm text-primary">Outlined</span>
</button>
<button class="h-20 rounded-lg bg-primary-container/10 flex flex-col items-center justify-center gap-2 border border-transparent hover:border-primary/50 transition-colors">
<div class="w-8 h-4 rounded-sm bg-primary-container/30"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Tinted</span>
</button>
</div>
</div>
<!-- Content Filter Accordion (Collapsed) -->
<button class="w-full flex justify-between items-center py-4 border-b border-surface-container-highest group">
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary transition-colors">Content Filter</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">expand_more</span>
</button>
</div></div>
</div>
<!-- Sticky Actions -->
<div class="p-gutter bg-surface-container border-t border-surface-container-highest z-20 flex flex-col gap-4"><button class="w-full h-[48px] rounded-full border border-outline text-primary font-label-md text-label-md hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                    Regenerate with these changes
                </button>
<button class="w-full py-2 text-center text-on-surface-variant font-label-sm text-label-sm hover:text-on-surface transition-colors uppercase tracking-widest">
                    Version history
                </button></div>
</section>
</main>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
