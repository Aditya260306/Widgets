        body { background-color: #0A0A0F; } /* Override background as requested */

<body class="text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 bg-transparent shrink-0">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors duration-300 scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-widest">Size &amp; Layout</h1>
</div>
<div class="font-label-md text-label-md text-tertiary">
            Step 4 of 6
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-8 w-full max-w-container-max-width mx-auto">
<div class="w-full max-w-md flex flex-col gap-8">
<!-- Size Grid Selection -->
<section class="flex flex-col gap-4">
<h2 class="font-body-lg text-body-lg text-on-surface">Select Dimensions</h2>
<div class="bg-surface-container rounded-xl p-6 flex justify-center items-center">
<!-- Abstract Phone Mockup Grid -->
<div class="grid grid-cols-4 grid-rows-4 gap-2 w-48 h-64 bg-surface-container-lowest p-2 rounded-xl relative overflow-hidden ring-1 ring-white/5">
<!-- 2x1 Widget -->
<div class="col-span-2 row-span-1 bg-surface rounded-lg flex items-center justify-center border border-transparent hover:border-surface-variant cursor-pointer transition-colors duration-300">
<span class="font-data-mono text-data-mono text-on-surface-variant">2x1</span>
</div>
<!-- 2x1 Empty Space Filler -->
<div class="col-span-2 row-span-1 border border-dashed border-surface-variant/30 rounded-lg"></div>
<!-- 4x2 Selected Widget -->
<div class="col-span-4 row-span-2 bg-surface-container-high rounded-lg flex items-center justify-center border-2 border-[#7C5CFC] cursor-pointer shadow-[0_0_15px_rgba(124,92,252,0.15)] relative">
<span class="font-data-mono text-data-mono text-[#7C5CFC]">4x2</span>
<div class="absolute inset-0 bg-[#7C5CFC]/5 rounded-lg"></div>
</div>
<!-- 2x4 Widget (Represented as occupying bottom half vertically)-->
<div class="col-span-2 row-span-1 border border-dashed border-surface-variant/30 rounded-lg"></div>
<div class="col-span-2 row-span-1 border border-dashed border-surface-variant/30 rounded-lg"></div>
</div>
</div>
</section>
<!-- Preview Panel -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<h2 class="font-body-lg text-body-lg text-on-surface">Preview</h2>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Live</span>
</div>
<!-- Actual 4x2 Preview representation -->
<div class="w-full h-32 bg-surface-container-high rounded-xl p-4 flex flex-col gap-2 relative ring-1 ring-white/5 overflow-hidden">
<!-- decorative abstract visual -->
<div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-primary-container/20 to-transparent blur-2xl rounded-full translate-x-1/2 -translate-y-1/4 pointer-events-none"></div>
<div class="flex items-center gap-3 relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-size: 16px;">auto_awesome</span>
</div>
<h3 class="font-label-md text-label-md text-on-surface">Daily Insight</h3>
</div>
<div class="mt-auto relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed opacity-80">
                             Focus on deep work sessions today. Your cognitive peak is approaching in 45 mins.
                         </p>
</div>
</div>
</section>
<!-- Options Toggles -->
<section class="flex flex-col gap-6 mt-4">
<!-- Toggle 1 -->
<div class="flex items-center justify-between">
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="toggle-header">Show header?</label>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-[#7C5CFC]" id="toggle-header" role="switch" type="button">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-surface-container-lowest shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
<!-- Toggle 2 -->
<div class="flex items-center justify-between">
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="toggle-icon">Show icon?</label>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-[#7C5CFC]" id="toggle-icon" role="switch" type="button">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-surface-container-lowest shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
</section>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full px-margin-mobile md:px-margin-desktop py-6 bg-transparent flex justify-center mt-auto shrink-0 z-50">
<button class="w-full max-w-md h-[52px] bg-[#7C5CFC] text-white font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-[#6b4ce6] transition-colors duration-300">
            Continue
        </button>
</footer>
