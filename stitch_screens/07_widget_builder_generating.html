<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AURA Widget Builder - Phase B</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdf94",
                        "on-primary-fixed-variant": "#4918c8",
                        "surface": "#131318",
                        "on-tertiary-fixed": "#002117",
                        "surface-variant": "#35343a",
                        "on-tertiary-fixed-variant": "#00513e",
                        "surface-container-low": "#1b1b20",
                        "on-background": "#e4e1e9",
                        "background": "#131318",
                        "on-surface-variant": "#c9c4d8",
                        "on-secondary": "#3e2e00",
                        "error-container": "#93000a",
                        "surface-container": "#1f1f25",
                        "surface-bright": "#39383e",
                        "surface-container-high": "#2a292f",
                        "on-tertiary-container": "#003024",
                        "tertiary-container": "#00a481",
                        "on-secondary-fixed": "#241a00",
                        "on-error": "#690005",
                        "inverse-surface": "#e4e1e9",
                        "on-primary-fixed": "#1c0062",
                        "secondary-container": "#ba9000",
                        "on-surface": "#e4e1e9",
                        "inverse-primary": "#613de0",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#0e0e13",
                        "primary-container": "#947dff",
                        "on-secondary-fixed-variant": "#594400",
                        "on-secondary-container": "#3c2c00",
                        "on-tertiary": "#00382a",
                        "primary-fixed-dim": "#cabeff",
                        "secondary": "#efc13e",
                        "on-primary": "#32009a",
                        "surface-tint": "#cabeff",
                        "surface-container-highest": "#35343a",
                        "inverse-on-surface": "#303036",
                        "tertiary-fixed-dim": "#28dfb3",
                        "tertiary-fixed": "#55fcce",
                        "surface-dim": "#131318",
                        "primary": "#cabeff",
                        "tertiary": "#28dfb3",
                        "on-primary-container": "#2b0088",
                        "outline-variant": "#484555",
                        "outline": "#938ea1",
                        "secondary-fixed-dim": "#efc13e",
                        "primary-fixed": "#e6deff",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "margin-mobile": "24px",
                        "container-max-width": "1200px",
                        "unit": "8px",
                        "gutter": "16px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "body-lg": ["Noto Serif"],
                        "headline-lg": ["Noto Serif"],
                        "data-mono": ["JetBrains Mono"],
                        "label-sm": ["Noto Serif"],
                        "body-md": ["Noto Serif"],
                        "label-md": ["Noto Serif"],
                        "headline-lg-mobile": ["Noto Serif"],
                        "headline-md": ["Noto Serif"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "data-mono": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0A0A0F; } /* Override background as requested */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }
        .animate-pulse-subtle {
            animation: subtle-pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-line {
            position: relative;
            overflow: hidden;
            background-color: rgba(202, 190, 255, 0.1); /* primary with low opacity */
        }
        .shimmer-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(202, 190, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center font-body-md relative overflow-hidden" style="background-color: #0A0A0F;">
<!-- Top Right Actions -->
<div class="flex flex-col items-center w-full px-margin-mobile max-w-2xl">
<!-- Summary Chip -->
<div class="mb-12 border border-outline rounded-full py-2 px-4 flex items-center gap-3 max-w-full bg-transparent"><span class="font-label-md text-label-md text-on-surface-variant truncate">Daily weather for my commute...</span><button class="text-on-surface-variant hover:text-on-surface flex-shrink-0 transition-colors"><span class="material-symbols-outlined text-[20px]">close</span></button></div>
<!-- Glowing Generation Area -->
<div class="relative w-full max-w-[340px] h-[240px] mb-10">
<!-- Glow background -->
<div class="absolute inset-0 bg-primary-container blur-3xl opacity-20 rounded-2xl animate-pulse-subtle"></div>
<!-- The Widget Outline -->
<div class="relative w-full h-full border-2 border-primary-container/60 bg-primary-container/[0.08] rounded-2xl flex flex-col justify-center px-6 gap-4 animate-pulse-subtle overflow-hidden backdrop-blur-sm">
<!-- Skeleton lines -->
<div class="h-3 w-3/4 rounded-full shimmer-line"></div>
<div class="h-3 w-1/2 rounded-full shimmer-line"></div>
<div class="h-10 w-full rounded-lg shimmer-line mt-2"></div>
</div>
</div>
<!-- Status Text -->
<div class="text-center h-8 relative w-full overflow-hidden">
<!-- Using absolute positioning for a simple fade/slide simulation without JS -->
<div class="absolute w-full top-0 left-0">
<p class="font-body-lg text-body-lg text-on-surface-variant italic font-['Noto_Serif']">Designing the layout...</p>
</div>
</div>
</div>
<div class="absolute bottom-margin-mobile md:bottom-margin-desktop left-0 right-0 px-margin-mobile flex justify-center w-full">
<button class="w-full max-w-[340px] h-[56px] bg-primary-container text-on-primary-container rounded-[12px] font-label-md text-label-md shadow-lg shadow-black/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center">Cancel</button>
</div></body></html>
